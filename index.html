<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.ico">
<meta charset="UTF-8">
<title>Tài Xỉu Casino</title>

<style>
body{
  margin:30px;
  background:#0b1020;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:130vh;
  background:url("images/bg.webp");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}


.game{
  width:420px;
  background:#020617;
  border-radius: 30px;
  padding:5px;
  position:relative;
}

/* TEXT */
.top{text-align:center;font-weight:bold;}
.money,.bet{text-align:center;margin:6px 0;}
.money-area{
  text-align:center;
  margin:8px 0;
}


/* BET */
.bet{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
}
.bet span{min-width:40px;text-align:center;}
.bet button{
  width:26px;height:26px;
  border:none;border-radius:50%;
  background:#334155;color:#fff;
  cursor:pointer;
}
.bet button:last-child{background:#dc2626;}

/* CHIP */
.chips{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}
.chip{
  width:55px;
  cursor:pointer;
  transition:.15s;
}
.chip:hover{transform:scale(1.1);}

/* BOWL */
.bowl-area{
  position:relative;
  width:260px;
  height:20px;
  margin:20px auto 10px; /* 👈 trên ít, dưới ít */
  margin-top: 250px;
}

.dice-area{
  position:absolute;
  bottom:35px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:15px;
}

.dice{
  width:45px;height:45px;
  background:#fff;color:#000;
  border-radius:8px;
  font-size:24px;font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bowl-wrap{
  position:absolute;
  bottom:10px;
  width:100%;
  height:140px;
  transition:.25s ease-out;
}

.bowl{
  width:100%;
  height:100%;
  background:#e5e7eb;
  border-radius:140px 140px 0 0;
  cursor:pointer;
}

.plate{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:360px;                 /* 👉 dĩa dài hơn */
  height:20px;

  background:radial-gradient(ellipse at center,
    #f1f5f9 0%,
    #cbd5e1 40%,
    #9ca3af 65%,
    #6b7280 100%);

  border-radius:0 0 180px 180px;
  z-index:6;                   /* 👉 CAO NHẤT */
  pointer-events:none;
}

/* BUTTON */
.buttons{
  display:flex;
  justify-content:space-around;
  margin-top:0;
  transform: none;
}
.buttons button{
  width:120px;
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
  color:#fff;
}
.tai{background:#22c55e;}
.xiu{background:#3b82f6;}

/* HISTORY */
.history{
  margin-top: 30px;
  border:1px solid #334155;
  border-radius:8px;
  padding:8px;
  max-height:120px;
  overflow:auto;
  transform: none;
}
.history h4{margin:0 0 6px;text-align:center;}
.history-item{
  font-size:14px;
  border-bottom:1px solid #1e293b;
  padding:3px 0;
}

.multiplier-float{
  position:absolute;
  left:50%;
  bottom:120px;
  transform:translateX(-50%);
  font-size:36px;
  font-weight:bold;
  pointer-events:none;
  animation: floatUp 1.2s ease-out forwards;
  text-shadow:0 0 20px currentColor;
}

.multiplier-2{ color:#22c55e; }
.multiplier-3{ color:#3b82f6; }
.multiplier-5{ color:#facc15; }

@keyframes floatUp{
  0%{ opacity:0; transform:translate(-50%,20px) scale(.6); }
  20%{ opacity:1; }
  100%{ opacity:0; transform:translate(-50%,-60px) scale(1.2); }
}

.buff-bar{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:10px 0;
}

.buff{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#1e293b;
  border:2px solid #334155;
  position:relative;
}

.buff::after{
  content:"×" attr(data-m);
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  opacity:.5;
}

/* đang sạc */
.buff.charging{
  box-shadow:0 0 12px #64748b;
  opacity:.8;
}

/* đã kích hoạt */
.buff.active{
  background:#22c55e;
  box-shadow:0 0 20px #22c55e;
  opacity:1;
}

/* mốc 10 – MAX */
.buff.max{
  background:#facc15;
  box-shadow:0 0 30px #facc15;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.1); }
  100%{ transform:scale(1); }
}
.buff{
  position:relative;
  cursor:pointer;
}

/* tooltip */
.buff-tooltip{
  position:absolute;
  bottom:110%;
  left:50%;
  transform:translateX(-50%);
  background:#020617;
  color:#fff;
  padding:6px 10px;
  border-radius:8px;
  font-size:13px;
  white-space:nowrap;
  box-shadow:0 0 15px rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:10;
}

.buff-tooltip::after{
  content:"";
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:#020617;
}

/* hiện tooltip */
.buff.show-tooltip .buff-tooltip{
  opacity:1;
  pointer-events:auto;
}
#lixiBtn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#facc15,#f97316);
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
#lixiBtn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* ===== SHAKE GROUP ===== */
.shake-group{
  position:relative;
  z-index:50;
  transform-origin:center bottom;
}

.shake-group.focus{
  transform: scale(1.4);
}



/* ===== LẮC QUA TRÁI PHẢI ===== */
@keyframes shakeSide{
  0%   { transform:scale(1.4) translateX(0); }
  15%  { transform:scale(1.4) translateX(-40px); }
  30%  { transform:scale(1.4) translateX(40px); }
  45%  { transform:scale(1.4) translateX(-32px); }
  60%  { transform:scale(1.4) translateX(32px); }
  75%  { transform:scale(1.4) translateX(-22px); }
  100% { transform:scale(1.4) translateX(0); }
}


.shake-group.focus.shaking{
  animation: shakeSide .9s cubic-bezier(.36,.07,.19,.97);
}

#focusOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:40;
}

#focusOverlay.show{
  opacity:1;
  pointer-events:auto;
}


.focus-stage{
  position:relative;
  opacity:1;
  pointer-events:auto;
  transform:none;
}


.focus-stage.show{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(1.15);
  z-index:100;
}

.game{
  position:relative;
  z-index:1;
}

.dice.reveal{
  animation: popDice .25s ease-out;
}

@keyframes popDice{
  0%{ transform:scale(.6); opacity:0; }
  100%{ transform:scale(1); opacity:1; }
}

#fireworks{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:300;
}
.fw-canvas{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}

/* ===== XOAY XÚC XẮC CUỐI ===== */
@keyframes diceSpin {
  0%   { transform: rotate(0deg) scale(1); }
  100% { transform: rotate(360deg) scale(1.05); }
}

.dice.spinning{
  animation: spinDice .8s linear;
}
@keyframes spinDice{
  from{ transform:rotate(0deg) scale(0.8); }
  to{ transform:rotate(720deg) scale(1); }
}

#decisionBonusInfo{
  display:none;
  font-size:13px;
  color:#22c55e;
  margin-top:6px;
  animation:pulseBonus 1s infinite;
}


@keyframes pulseBonus{
  0%{ opacity:.6; }
  50%{ opacity:1; }
  100%{ opacity:.6; }
}

#decisionPanel{
  position:fixed;
  top:50%;
  left:calc(50% - 270px); /* 420/2 + khoảng cách 60px */
  transform:translate(-120%, -50%);
  opacity:0;

  background:#020617;
  border:2px solid #334155;
  border-radius:12px;
  padding:12px;
  text-align:center;

  transition:all .35s cubic-bezier(.2,.8,.2,1);
  z-index:9999;
}

#decisionPanel.show{
  transform:translate(0,-50%);
  opacity:1;
}





</style>
</head>
<body>
<div class="game">
  <div class="top">🎲 TÀI XỈU CASINO</div>

<div class="money-area">
  <div class="money">💰 Tiền: <span id="money">2000</span></div>
  <button id="lixiBtn" onclick="claimLixi()">🧧 Nhận lì xì</button>

</div>

  
  <div class="bet">
    🎯 Cược:
    <button onclick="changeBet(-10)">−</button>
    <span id="bet">0</span>
    <button onclick="changeBet(10)">+</button>
    <button onclick="clearBet()">🗑</button>
  </div>

  <div class="chips">
    <img src="images/chip-25.png" class="chip" onclick="addBet(25)">
    <img src="images/chip-50.png" class="chip" onclick="addBet(50)">
    <img src="images/chip-100.png" class="chip" onclick="addBet(100)">
    <img src="images/chip-250.png" class="chip" onclick="addBet(250)">
    <img src="images/chip-500.png" class="chip" onclick="addBet(500)">
    <img src="images/chip-1000.png" class="chip" onclick="addBet(1000)">
  </div>

<div class="buff-bar">
  <div class="buff buff-2" data-m="2"></div>
  <div class="buff buff-3" data-m="3"></div>
  <div class="buff buff-5" data-m="5"></div>
</div>


<div class="bowl-area">
  <div class="shake-group" id="shakeGroup">

    <div class="dice-area">
      <div class="dice">?</div>
      <div class="dice">?</div>
      <div class="dice">?</div>
    </div>

    <div class="bowl-wrap" id="bowlWrap">
      <div class="bowl" id="bowl"></div>
    </div>

    <div class="plate"></div>
  </div>
</div>

<div id="focusOverlay"></div>


<div class="buttons">
    <button class="tai" onclick="play('tai')">TÀI</button>
    <button class="xiu" onclick="play('xiu')">XỈU</button>
  </div>

<div class="history">
    <h4>Lịch sử</h4>
    <div id="historyList"></div>
  </div>
<!-- POPUP THẮNG / THUA -->
<div id="overlay" class="overlay hidden">
  <div class="popup">
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
  </div>
</div>
<canvas id="fireworks" class="fw-canvas"></canvas>
</div>
<div id="decisionPanel">
  <div id="decisionWarning" style="font-size:13px;color:#facc15;margin-bottom:6px">
    "⚠️ Chỉ được đổi cửa và tăng cược 1 lần duy nhất"
  </div>

  <div style="margin-bottom:6px">
    ⏳ <span id="decisionCountdown">10</span>s
  </div>
  <div id="decisionBonusInfo"
     style="
       font-size:13px;
       color:#22c55e;
       margin-top:6px;
     ">
  💡 Tăng cược từ <b>100</b> trở lên sẽ được thưởng thêm <b>50%</b>
    </div>
  </div>


<script>
let money = 2000;
let bet = 0;
let isBowlOpen = false;
let pendingResult = null;
let resultHandled = false;
let lixiClaimed = false;
let winStreak = 0;
let fireworks = [];
let particles = [];
let fwRunning = false;
let phase = "idle"; 
let decisionUsed = false;
let decisionTimer = null;
let decisionTimeLeft = 10;
let canResolveResult = false;
let decisionChanged = false;
let baseBet = 0;
let extraBet = 0;


const bowl = document.getElementById("bowl");
const bowlWrap = document.getElementById("bowlWrap");
const diceEls = document.querySelectorAll(".dice");
const historyList = document.getElementById("historyList");
const focusOverlay = document.getElementById("focusOverlay");
const fwCanvas = document.getElementById("fireworks");
const ctx = fwCanvas.getContext("2d");


/* ===== BET ===== */
function addBet(v){

  // ===== PHASE TĂNG CƯỢC (decision) =====
  if(phase === "decision"){
    const info = document.getElementById("decisionBonusInfo");

    if(v >= 100){
      info.style.display = "block";
    }else{
      info.style.display = "none";
    }

    if(decisionUsed) return alert("⚠️ Chỉ được tăng cược 1 lần!");
    if(v > bet) return alert("Không được tăng quá mức cược ban đầu");
    if(money < v) return alert("Không đủ tiền để tăng cược");

    extraBet += v;
    bet += v;
    money -= v;


    document.getElementById("money").innerText = money;
    updateBet();

    decisionUsed = true;
    endDecisionPhase(); // khóa luôn
    return;
  }

  // ===== CƯỢC BÌNH THƯỜNG =====
  if(pendingResult) return alert("Mở bát đi rồi cược tiếp");
  if(money < bet + v) return alert("Không đủ tiền");

  bet += v;
  updateBet();
}

function changeBet(v){
  if(pendingResult) return;
  if(bet + v < 0) return;
  if(money < bet + v) return alert("Không đủ tiền, tao nuốt hết rồi");
  bet += v;
  updateBet();
}
function clearBet(){
  bet = 0;
  updateBet();
}
function updateBet(){
  document.getElementById("bet").innerText = bet;
}

/* ===== PLAY ===== */
function play(choice){

  // ===== ĐỔI CỬA TRONG DECISION =====
  if(phase === "decision"){
    if(decisionChanged) return alert("⚠️ Chỉ được đổi cửa 1 lần!");
    pendingResult.choice = choice;
    decisionChanged = true;
    return;
  }

  // ===== CHƠI BÌNH THƯỜNG =====
  if(bet === 0) return alert("Chưa đặt cược");
  if(pendingResult) return alert("Đang chơi ván này rồi");

  money -= bet;
  baseBet = bet; 
  extraBet = 0;    

  document.getElementById("money").innerText = money;

  startShake();
  closeBowl();

  const d1 = rand(), d2 = rand(), d3 = rand();
  const total = d1 + d2 + d3;
  const isTriple = (d1 === d2 && d2 === d3);

  let result;
  if(isTriple) result = "triple";
  else if(total <= 10) result = "xiu";
  else result = "tai";

  pendingResult = { d1,d2,d3,total,result,choice };
  decisionChanged = false;
  resultHandled = false;

  diceEls.forEach(d=>d.innerText="?");
}



/* ===== MỞ BÁT ===== */
function openBowl(){
  if(phase === "decision") return;
  if(!pendingResult || resultHandled) return;

  stopShake();

  resultHandled = true;
  isBowlOpen = true;
  bowlWrap.style.transform = "translateY(-80px)";

  const { d1, d2 } = pendingResult;

  // reset
  diceEls.forEach(d=>{
    d.innerText = "?";
    d.classList.remove("reveal");
  });

  // hiện 2 viên đầu
  setTimeout(()=>{
    diceEls[0].innerText = d1;
    diceEls[0].classList.add("reveal");
  },200);

  setTimeout(()=>{
    diceEls[1].innerText = d2;
    diceEls[1].classList.add("reveal");
  },350);

  // quyết định có cho tăng cược không
  setTimeout(()=>{
    const s = d1 + d2;
    const sureResult = (s <= 4 || s >= 11);

    if(sureResult){
      revealLastDice();
    }else{
      startDecisionPhase();
    }
  },600);
}


function getMultiplier(streak){
  if(streak >= 10) return 5;
  if(streak >= 5) return 3;
  if(streak >= 3) return 2;
  return 1;
}


/* ===== ĐÓNG BÁT ===== */
function closeBowl(){
  isBowlOpen = false;
  bowlWrap.style.transform = "translateY(0)";
}

function updateBuffUI(){
  document.querySelectorAll(".buff").forEach(b=>{
    b.classList.remove("active","charging","max");
  });

  if(winStreak >= 1 && winStreak < 3)
    document.querySelector('.buff[data-m="2"]').classList.add("charging");

  if(winStreak >= 3)
    document.querySelector('.buff[data-m="2"]').classList.add("active");

  if(winStreak >= 4 && winStreak < 5)
    document.querySelector('.buff[data-m="3"]').classList.add("charging");

  if(winStreak >= 5)
    document.querySelector('.buff[data-m="3"]').classList.add("active");

  if(winStreak >= 9 && winStreak < 10)
    document.querySelector('.buff[data-m="5"]').classList.add("charging");

  if(winStreak >= 10)
    document.querySelector('.buff[data-m="5"]').classList.add("active","max");
}

document.querySelectorAll(".buff").forEach(buff=>{
  const m = buff.dataset.m;

  const tooltip = document.createElement("div");
  tooltip.className = "buff-tooltip";

  if(m === "2"){
    tooltip.innerText = "Thắng 3 ván liên tiếp → x2 tiền cược";
  }
  if(m === "3"){
    tooltip.innerText = "Thắng 5 ván liên tiếp → x3 tiền cược";
  }
  if(m === "5"){
    tooltip.innerText = "Thắng 10 ván liên tiếp → x5 tiền cược";
  }

  buff.appendChild(tooltip);

  buff.addEventListener("click", e=>{
    e.stopPropagation();

    document.querySelectorAll(".buff")
      .forEach(b=>b.classList.remove("show-tooltip"));

    buff.classList.toggle("show-tooltip");
  });
});

/* click ra ngoài → tắt tooltip */
document.addEventListener("click", ()=>{
  document.querySelectorAll(".buff")
    .forEach(b=>b.classList.remove("show-tooltip"));
});

/* ===== KÉO MỞ / TAP ĐÓNG ===== */
let startY = null;

bowl.addEventListener("pointerdown", e=>{
  startY = e.clientY;
  if(isBowlOpen){
    e.preventDefault();
    closeBowl();
  }
});

bowl.addEventListener("pointermove", e=>{
  if(startY === null || isBowlOpen) return;
  const diff = startY - e.clientY;
  if(diff > 0){
    bowlWrap.style.transform = `translateY(-${Math.min(diff,120)}px)`;
  }
});

bowl.addEventListener("pointerup", e=>{
  if(startY === null || isBowlOpen) return;
  if(startY - e.clientY > 60) openBowl();
  else bowlWrap.style.transform = "translateY(0)";
  startY = null;
});

/* ===== BUFF UI ===== */
function showMultiplierFloat(multiplier){
  if(multiplier < 2) return;

  const div = document.createElement("div");
  div.className = `multiplier-float multiplier-${multiplier}`;
  div.innerText = `×${multiplier}`;

  document.querySelector(".bowl-area").appendChild(div);

  setTimeout(()=>div.remove(),1200);
}

function showPopup(type){
  const overlay = document.getElementById("overlay");
  const title = document.getElementById("popupTitle");
  const text = document.getElementById("popupText");

  if(type === "win"){
    title.innerText = "🎉 THẮNG!";
    text.innerText = "Ăn rùa được tưởng mình hay hả?!";
  }else{
    title.innerText = "💥 THUA!";
    text.innerText = "Haha thấy ngu chưa con ơi!";
  }

  overlay.classList.remove("hidden");

  setTimeout(()=>{
    overlay.classList.add("hidden");
  },1500);
}
function claimLixi(){
  if(lixiClaimed){
    showModal("lose");
    document.getElementById("modalText").innerText =
      "🧧 Bạn đã nhận lì xì rồi! Reload trang để nhận lại.";
    return;
  }

  const amount = Math.floor(Math.random()*401) + 500;

  money += amount;
  document.getElementById("money").innerText = money;

  lixiClaimed = true;// config 

  showModal("win");
  document.getElementById("modalText").innerText =
    `🧧 Bạn nhận được ${amount} tiền lì xì!`;

  document.getElementById("lixiBtn").disabled = true;
}



function startShake(){
  // bật overlay + focus
  focusOverlay.classList.add("show");
  shakeGroup.classList.add("focus");

  // bắt đầu lắc
  shakeGroup.classList.add("shaking");

  // ⏱ lắc xong thì dừng, nhưng vẫn focus
  setTimeout(()=>{
    shakeGroup.classList.remove("shaking");
  }, 600); // đúng bằng thời gian animation
}


function stopShake(){
  shakeGroup.classList.remove("shaking","focus");
  focusOverlay.classList.remove("show");
}

function resizeFW(){
  fwCanvas.width = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeFW);
resizeFW();

class Firework{
  constructor(){
    this.x = Math.random() * fwCanvas.width;
    this.y = fwCanvas.height;
    this.targetY = Math.random() * fwCanvas.height * 0.4 + 80;
    this.speed = Math.random() * 3 + 4;
    this.exploded = false;
  }
  update(){
    this.y -= this.speed;
    if(this.y <= this.targetY){
      this.explode();
      this.exploded = true;
    }
  }
  draw(){
    ctx.fillStyle = "#fff";
    ctx.fillRect(this.x, this.y, 2, 6);
  }
    explode(){
    for(let i=0;i<120;i++){   // 👈 từ 50 → 120
      particles.push(new Particle(this.x,this.y));
    }
  }
}

class Particle{
  constructor(x,y){
    this.x = x;
    this.y = y;
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*6+3;
    this.vx = Math.cos(angle)*speed;
    this.vy = Math.sin(angle)*speed;
    this.life = 90;
    this.color = `hsl(${Math.random()*360},100%,70%)`;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05;
    this.life--;
  }
  draw(){
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x,this.y,3,3);
  }
}

function launchFireworks(count=5){
  fwRunning = true;
  for(let i=0;i<count;i++){
    fireworks.push(new Firework());
  }
}

function fwLoop(){
  if(!fwRunning) return;

  ctx.clearRect(0,0,fwCanvas.width,fwCanvas.height);

  fireworks = fireworks.filter(fw=>!fw.exploded);
  fireworks.forEach(fw=>{
    fw.update();
    fw.draw();
  });

  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.update();
    p.draw();
  });

  if(fireworks.length===0 && particles.length===0){
    fwRunning = false;
    ctx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
    return;
  }
  requestAnimationFrame(fwLoop);
}

function startDecisionPhase(){
  phase = "decision";
  decisionUsed = false;
  decisionTimeLeft = 10;
  canResolveResult = false;


  decisionPanel.classList.add("show");
    setTimeout(()=>{
  panel.classList.add("show");
    },10);
  updateDecisionCountdown();

  decisionTimer = setInterval(()=>{
    decisionTimeLeft--;
    updateDecisionCountdown();

    if(decisionTimeLeft <= 0){
      endDecisionPhase();
    }
  },1000);
}

function updateDecisionCountdown(){
  document.getElementById("decisionCountdown").innerText = decisionTimeLeft;
}

function endDecisionPhase(){
  clearInterval(decisionTimer);
  decisionPanel.classList.remove("show");
  setTimeout(()=>{
    panel.style.display = "none";
  },350);

  canResolveResult = true;   // 🔓 mở khóa
  revealLastDice();
}

function revealLastDice(){
  const dice = diceEls[2];

  dice.classList.add("spinning");

  setTimeout(()=>{
    dice.classList.remove("spinning");
    dice.innerText = pendingResult.d3;
    dice.classList.add("reveal");

    setTimeout(()=>{
      finishResult(); // ✅ DUY NHẤT Ở ĐÂY
    }, 350);

  }, 800);
}

function finishResult(){
  const { d1,d2,d3,total,result,choice } = pendingResult;

  let historyText = `${d1}-${d2}-${d3} | ${result.toUpperCase()} | ${total}`;

if(result === choice){

  winStreak++;

  const rewardMultiplier = getMultiplier(winStreak);

  // Base luôn x2
  let baseWin = baseBet * 2;

  // Extra theo mốc
  let extraWin = (extraBet >= 100)
    ? extraBet * 2.5
    : extraBet * 2;

  // Buff chỉ nhân base
  if(rewardMultiplier > 1){
    baseWin *= rewardMultiplier;
  }

  let payout = baseWin + extraWin;

  money += payout;
  document.getElementById("money").innerText = money;

  if(payout >= 1000){
    launchFireworks();
    fwLoop();
  }

  showMultiplierFloat(rewardMultiplier);
  historyText += ` | +${payout}`;
  showPopup("win");
  }else{
    winStreak = 0;
    historyText += ` | -${baseBet + extraBet}`;
    showPopup("lose");
  }

  updateBuffUI();
  addHistory(historyText);

  // ===== RESET =====
  bet = 0;
  baseBet = 0;
  extraBet = 0;

  updateBet();

  pendingResult = null;
  phase = "idle";
  decisionUsed = false;
  canResolveResult = false;
  decisionChanged = false;
}



/* ===== HISTORY ===== */
function addHistory(text){
  const div = document.createElement("div");
  div.className = "history-item";
  div.innerText = text;
  historyList.prepend(div);
}

/* ===== RANDOM ===== */
function rand(){
  return Math.floor(Math.random()*6)+1;
}
